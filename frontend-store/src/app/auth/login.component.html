<section class="auth-card panel">
  <span class="eyebrow">CHÀO MỪNG TRỞ LẠI</span>
  <h1>Đăng nhập</h1>
  <p class="muted">Tiếp tục hành trình tìm chiếc điện thoại của bạn.</p>
  <form #form="ngForm" (ngSubmit)="submit()">
    <label
      >Email<input
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        email
        autocomplete="email"
    /></label>
    <label
      >Mật khẩu<input
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        autocomplete="current-password"
    /></label>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <button [disabled]="form.invalid || busy()">
      {{ busy() ? 'Đang đăng nhập…' : 'Đăng nhập' }}
    </button>
  </form>
  <p>Chưa có tài khoản? <a routerLink="/register">Đăng ký ngay</a></p>
</section>
